name: Apply now_utc live-alert fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply_now_utc_fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch live alert timestamp dependency
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/daily_stock_analyse/live_alerts.py")
          text = path.read_text(encoding="utf-8")
          old_sig = '''def _build_live_setup_assessment(\n    analysis: StockAnalysis,\n    cfg: AppConfig,\n    phase: str,\n    min_setup_score: int,\n    session_policy: LiveSessionPolicy,\n    rvol_quality: str,\n    rr_ratio: float | None,\n) -> dict:\n'''
          new_sig = '''def _build_live_setup_assessment(\n    analysis: StockAnalysis,\n    cfg: AppConfig,\n    phase: str,\n    min_setup_score: int,\n    session_policy: LiveSessionPolicy,\n    rvol_quality: str,\n    rr_ratio: float | None,\n    now_utc: datetime,\n) -> dict:\n'''
          if old_sig not in text:
              raise SystemExit("Expected _build_live_setup_assessment signature not found")
          text = text.replace(old_sig, new_sig, 1)
          old_call = '''        session_policy,\n        rvol_quality=rvol_quality,\n        rr_ratio=rr_ratio,\n    )\n'''
          new_call = '''        session_policy,\n        rvol_quality=rvol_quality,\n        rr_ratio=rr_ratio,\n        now_utc=now_utc,\n    )\n'''
          if old_call not in text:
              raise SystemExit("Expected _build_live_setup_assessment call not found")
          text = text.replace(old_call, new_call, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify syntax and regression condition
        run: |
          python -m compileall -q src
          python - <<'PY'
          import ast
          from pathlib import Path
          path = Path("src/daily_stock_analyse/live_alerts.py")
          tree = ast.parse(path.read_text(encoding="utf-8"))
          target = next(
              node for node in tree.body
              if isinstance(node, ast.FunctionDef) and node.name == "_build_live_setup_assessment"
          )
          names = [arg.arg for arg in target.args.args]
          assert "now_utc" in names, names
          print("Regression check passed: _build_live_setup_assessment accepts now_utc")
          PY

      - name: Commit fix to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/daily_stock_analyse/live_alerts.py .github/workflows/apply_now_utc_fix.yml
          git rm .github/workflows/apply_now_utc_fix.yml
          git commit -m "fix: pass live alert evaluation timestamp explicitly"
          git push origin main

# final verification trigger
