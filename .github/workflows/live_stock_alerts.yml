name: Live Stock Alerts

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * 1-5"

env:
  SEND_EMAIL: "0"

jobs:
  live-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore alert state
        id: restore-alert-state
        uses: actions/cache/restore@v4
        with:
          path: artifacts/alert_state.json
          key: live-alert-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            live-alert-state-${{ github.ref_name }}-

      - name: Run live alerts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          MIN_SETUP_SCORE: ${{ vars.MIN_SETUP_SCORE }}
          MIN_RELATIVE_VOLUME: ${{ vars.MIN_RELATIVE_VOLUME }}
          DAY_TRADE_THRESHOLD: ${{ vars.DAY_TRADE_THRESHOLD }}
          LONG_THRESHOLD: ${{ vars.LONG_THRESHOLD }}
          SHORT_THRESHOLD: ${{ vars.SHORT_THRESHOLD }}
          DYNAMIC_COUNT: ${{ vars.DYNAMIC_COUNT }}
          DAY_TRADE_GAP_THRESHOLD: ${{ vars.DAY_TRADE_GAP_THRESHOLD }}
          DAY_TRADE_RVOL_THRESHOLD: ${{ vars.DAY_TRADE_RVOL_THRESHOLD }}
          DAY_TRADE_MIN_SETUP_SCORE: ${{ vars.DAY_TRADE_MIN_SETUP_SCORE }}
          MORNING_REPORT_TIME: ${{ vars.MORNING_REPORT_TIME }}
          MORNING_REPORT_TIMEZONE: ${{ vars.MORNING_REPORT_TIMEZONE }}
          LIVE_ALERT_ENABLED: ${{ vars.LIVE_ALERT_ENABLED }}
          LIVE_ALERT_INTERVAL_MINUTES: ${{ vars.LIVE_ALERT_INTERVAL_MINUTES }}
          LIVE_MARKET_TIMEZONE: ${{ vars.LIVE_MARKET_TIMEZONE }}
          LIVE_MARKET_OPEN: ${{ vars.LIVE_MARKET_OPEN }}
          LIVE_MARKET_CLOSE: ${{ vars.LIVE_MARKET_CLOSE }}
          ALERT_MIN_SETUP_SCORE: ${{ vars.ALERT_MIN_SETUP_SCORE }}
          ALERT_MIN_RVOL: ${{ vars.ALERT_MIN_RVOL }}
          ALERT_COOLDOWN_MINUTES: ${{ vars.ALERT_COOLDOWN_MINUTES }}
          TELEGRAM_ENABLED: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.daily_stock_analyse.live_alerts

      - name: Save alert state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: artifacts/alert_state.json
          key: live-alert-state-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload live artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: live-stock-alert-artifacts
          path: artifacts/
