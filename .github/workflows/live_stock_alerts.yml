name: Live Stock Alerts

on:
  workflow_dispatch:
    inputs:
      telegram_test:
        description: "Run one-time Telegram connectivity test (no trading logic/state/email)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    # GitHub-hosted jobs are limited to roughly 6 hours, so restart across the day.
    - cron: "25 9 * * 1-5"
      timezone: "America/New_York"
    - cron: "00 15 * * 1-5"
      timezone: "America/New_York"
    - cron: "55 19 * * 1-5"
      timezone: "America/New_York"
    - cron: "55 1 * * 2-6"
      timezone: "America/New_York"

env:
  SEND_EMAIL: "0"

jobs:
  live-alerts:
    concurrency:
      group: live-stock-alerts-${{ github.workflow }}-${{ github.ref_name }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare alert artifacts directory
        run: mkdir -p artifacts

      - name: Restore alert state
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.telegram_test == 'true') }}
        id: restore-alert-state
        uses: actions/cache/restore@v5
        with:
          path: artifacts/alert_state.json
          key: live-alert-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            live-alert-state-${{ github.ref_name }}-

      - name: Run Telegram connectivity test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.telegram_test == 'true' }}
        env:
          TELEGRAM_ENABLED: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.daily_stock_analyse.telegram_connectivity_test

      - name: Run live alerts
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.telegram_test == 'true') }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ANALYSIS_SYMBOLS: ${{ vars.ANALYSIS_SYMBOLS }}
          MAX_ANALYSIS_SYMBOLS: ${{ vars.MAX_ANALYSIS_SYMBOLS }}
          FIXED_SIX_SYMBOLS: ${{ vars.FIXED_SIX_SYMBOLS }}
          MIN_SETUP_SCORE: ${{ vars.MIN_SETUP_SCORE }}
          MIN_RELATIVE_VOLUME: ${{ vars.MIN_RELATIVE_VOLUME }}
          DAY_TRADE_THRESHOLD: ${{ vars.DAY_TRADE_THRESHOLD }}
          LONG_THRESHOLD: ${{ vars.LONG_THRESHOLD }}
          SHORT_THRESHOLD: ${{ vars.SHORT_THRESHOLD }}
          DYNAMIC_COUNT: ${{ vars.DYNAMIC_COUNT }}
          DAY_TRADE_GAP_THRESHOLD: ${{ vars.DAY_TRADE_GAP_THRESHOLD }}
          DAY_TRADE_RVOL_THRESHOLD: ${{ vars.DAY_TRADE_RVOL_THRESHOLD }}
          DAY_TRADE_MIN_SETUP_SCORE: ${{ vars.DAY_TRADE_MIN_SETUP_SCORE }}
          MORNING_REPORT_TIME: ${{ vars.MORNING_REPORT_TIME }}
          MORNING_REPORT_TIMEZONE: ${{ vars.MORNING_REPORT_TIMEZONE }}
          LIVE_ALERT_ENABLED: "1"
          LIVE_AFTER_HOURS_ALERTS_ENABLED: "1"
          LIVE_PRE_MARKET_ALERTS_ENABLED: "1"
          LIVE_ALERT_INTERVAL_MINUTES: "5"
          LIVE_MARKET_TIMEZONE: "America/New_York"
          LIVE_MARKET_OPEN: "09:30"
          LIVE_MARKET_CLOSE: "16:00"
          LIVE_EXTENDED_CLOSE: "04:00"
          ALERT_MIN_SETUP_SCORE: "70"
          ALERT_MIN_RVOL: "1.5"
          ALERT_COOLDOWN_MINUTES: "15"
          TELEGRAM_ENABLED: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.daily_stock_analyse.live_alerts_overnight

      - name: Save alert state
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.telegram_test == 'true') }}
        uses: actions/cache/save@v5
        with:
          path: artifacts/alert_state.json
          key: live-alert-state-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload live artifacts
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.telegram_test == 'true') }}
        uses: actions/upload-artifact@v6
        with:
          name: live-stock-alert-artifacts
          path: artifacts/
          if-no-files-found: warn
