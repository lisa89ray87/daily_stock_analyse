name: Live Event Alerts

on:
  workflow_dispatch:
  schedule:
    # Timezone-aware schedules remove the manual EDT/EST split.
    - cron: "25 9 * * 1-5"
      timezone: "America/New_York"
    - cron: "30 15 * * 1-5"
      timezone: "America/New_York"

env:
  SEND_EMAIL: "0"

jobs:
  live-event-alerts:
    concurrency:
      # Event alerts are isolated from live trade alerts and from daily reports.
      # A replacement run cancels the stale event-alert worker to prevent duplicate Telegram batches.
      group: live-event-alerts-${{ github.workflow }}-${{ github.ref_name }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare event alert artifacts directory
        run: mkdir -p artifacts

      - name: Restore event alert state
        uses: actions/cache/restore@v5
        with:
          path: artifacts/event_alert_state.json
          key: live-event-alert-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            live-event-alert-state-${{ github.ref_name }}-

      - name: Run live event alerts
        env:
          ANALYSIS_SYMBOLS: ${{ vars.ANALYSIS_SYMBOLS }}
          MAX_ANALYSIS_SYMBOLS: ${{ vars.MAX_ANALYSIS_SYMBOLS }}
          FIXED_SIX_SYMBOLS: ${{ vars.FIXED_SIX_SYMBOLS }}
          LIVE_DATA_PROVIDER: "yfinance"
          LIVE_MARKET_TIMEZONE: "America/New_York"
          LIVE_MARKET_OPEN: "09:30"
          LIVE_MARKET_CLOSE: "16:00"
          MORNING_REPORT_TIMEZONE: ${{ vars.MORNING_REPORT_TIMEZONE }}
          EVENT_ALERT_ENABLED: "1"
          EVENT_ALERT_INTERVAL_MINUTES: "5"
          EVENT_ALERT_MAX_WORKERS: "6"
          EVENT_ALERT_COOLDOWN_MINUTES: "15"
          EVENT_ALERT_PRICE_CHANGE_PCT: "2.0"
          EVENT_ALERT_VOLUME_SPIKE_MULTIPLIER: "2.0"
          EVENT_ALERT_RSI_HIGH: "70"
          EVENT_ALERT_RSI_LOW: "30"
          TELEGRAM_ENABLED: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.daily_stock_analyse.event_alert_runner

      - name: Save event alert state
        if: ${{ always() }}
        uses: actions/cache/save@v5
        with:
          path: artifacts/event_alert_state.json
          key: live-event-alert-state-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload event alert artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: live-event-alert-artifacts
          path: artifacts/
          if-no-files-found: warn
