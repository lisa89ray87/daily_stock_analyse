name: Live Event Alerts

on:
  workflow_dispatch:
  schedule:
    - cron: "25 9 * * 1-5"
      timezone: "America/New_York"
    - cron: "00 15 * * 1-5"
      timezone: "America/New_York"
    - cron: "55 19 * * 1-5"
      timezone: "America/New_York"
    - cron: "55 1 * * 2-6"
      timezone: "America/New_York"

env:
  SEND_EMAIL: "0"

jobs:
  live-event-alerts:
    # Scheduled windows are spaced to avoid normal overlap; never cancel a
    # healthy monitoring run just because a later dispatch is queued.
    concurrency:
      group: live-event-alerts-${{ github.workflow }}-${{ github.ref_name }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare event alert artifacts directory
        run: mkdir -p artifacts

      - name: Restore event alert state
        uses: actions/cache/restore@v5
        with:
          path: artifacts/event_alert_state.json
          key: live-event-alert-state-v2-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            live-event-alert-state-v2-${{ github.ref_name }}-

      - name: Run live event alerts
        env:
          ANALYSIS_SYMBOLS: ${{ vars.ANALYSIS_SYMBOLS }}
          MAX_ANALYSIS_SYMBOLS: ${{ vars.MAX_ANALYSIS_SYMBOLS }}
          FIXED_SIX_SYMBOLS: ${{ vars.FIXED_SIX_SYMBOLS }}
          LIVE_DATA_PROVIDER: "yfinance"
          LIVE_MARKET_TIMEZONE: "America/New_York"
          LIVE_MARKET_OPEN: "09:30"
          LIVE_MARKET_CLOSE: "16:00"
          LIVE_EXTENDED_CLOSE: "04:00"
          MORNING_REPORT_TIMEZONE: ${{ vars.MORNING_REPORT_TIMEZONE }}
          EVENT_ALERT_ENABLED: "1"
          EVENT_ALERT_AFTER_HOURS_ENABLED: "1"
          EVENT_ALERT_PRE_MARKET_ENABLED: "1"
          EVENT_ALERT_INTERVAL_MINUTES: "5"
          EVENT_ALERT_MAX_WORKERS: "6"
          EVENT_ALERT_COOLDOWN_MINUTES: "15"
          EVENT_ALERT_PRICE_CHANGE_PCT: "2.0"
          EVENT_ALERT_VOLUME_SPIKE_MULTIPLIER: "2.0"
          EVENT_ALERT_RSI_HIGH: "70"
          EVENT_ALERT_RSI_LOW: "30"
          TELEGRAM_ENABLED: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.daily_stock_analyse.event_alert_runner_overnight

      - name: Save event alert state
        if: ${{ always() }}
        uses: actions/cache/save@v5
        with:
          path: artifacts/event_alert_state.json
          key: live-event-alert-state-v2-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload event alert artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: live-event-alert-artifacts-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn

      - name: Notify Telegram on engine failure
        if: ${{ failure() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ.get("TELEGRAM_BOT_TOKEN")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID")
          if not token or not chat_id:
              raise SystemExit("Telegram failure notification skipped: credentials unavailable")

          text = "🚨 LIVE EVENT ENGINE FAILURE\nGitHub Actions workflow failed. Check the latest Live Event Alerts run before relying on event monitoring."
          data = urllib.parse.urlencode({"chat_id": chat_id, "text": text}).encode()
          url = f"https://api.telegram.org/bot{token}/sendMessage"
          with urllib.request.urlopen(urllib.request.Request(url, data=data, method="POST"), timeout=15) as response:
              if response.status != 200:
                  raise SystemExit(f"Telegram failure notification returned HTTP {response.status}")
          PY
