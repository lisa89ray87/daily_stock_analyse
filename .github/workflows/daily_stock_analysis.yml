name: Daily Stock Analysis

on:
  workflow_dispatch:
  schedule:
    # Keep the schedule in New York time so DST is handled by GitHub.
    - cron: "30 9 * * 1-5"
      timezone: "America/New_York"
    - cron: "0 16 * * 1-5"
      timezone: "America/New_York"

# Do not let a delayed/manual run cancel the other scheduled report window.
# Manual runs share one group; open and close schedules have separate groups.
concurrency:
  group: daily-stock-analysis-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: true

env:
  SEND_EMAIL: "1"

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Determine report window
        id: report_window
        env:
          SCHEDULE: ${{ github.event.schedule }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os

          schedule = os.environ.get("SCHEDULE", "")
          event_name = os.environ.get("EVENT_NAME", "")
          scheduled_windows = {
              "30 9 * * 1-5": "US_MARKET_OPEN",
              "0 16 * * 1-5": "US_MARKET_CLOSE",
          }

          if event_name == "workflow_dispatch":
              target = "MANUAL"
          else:
              target = scheduled_windows.get(schedule)

          print(f"Workflow event: {event_name}")
          print(f"Scheduled expression: {schedule or 'NONE'}")
          print(f"Report window: {target or 'SKIP'}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"run={'true' if target else 'false'}\n")
              fh.write(f"report_window={target or ''}\n")
          PY

      - name: Install dependencies
        if: steps.report_window.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare report artifacts directory
        if: steps.report_window.outputs.run == 'true'
        run: mkdir -p artifacts

      - name: Run analysis
        if: steps.report_window.outputs.run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ANALYSIS_SYMBOLS: ${{ vars.ANALYSIS_SYMBOLS }}
          MAX_ANALYSIS_SYMBOLS: ${{ vars.MAX_ANALYSIS_SYMBOLS }}
          FIXED_SIX_SYMBOLS: ${{ vars.FIXED_SIX_SYMBOLS }}
          AI_PRIMARY_PROVIDER: ${{ vars.AI_PRIMARY_PROVIDER }}
          AI_FALLBACK_PROVIDER: ${{ vars.AI_FALLBACK_PROVIDER }}
          DAILY_REPORT_CRON_UTC: ${{ vars.DAILY_REPORT_CRON_UTC }}
          MIN_SETUP_SCORE: ${{ vars.MIN_SETUP_SCORE }}
          MIN_RELATIVE_VOLUME: ${{ vars.MIN_RELATIVE_VOLUME }}
          DAY_TRADE_THRESHOLD: ${{ vars.DAY_TRADE_THRESHOLD }}
          LONG_THRESHOLD: ${{ vars.LONG_THRESHOLD }}
          SHORT_THRESHOLD: ${{ vars.SHORT_THRESHOLD }}
          DYNAMIC_COUNT: ${{ vars.DYNAMIC_COUNT }}
          DAY_TRADE_GAP_THRESHOLD: ${{ vars.DAY_TRADE_GAP_THRESHOLD }}
          DAY_TRADE_RVOL_THRESHOLD: ${{ vars.DAY_TRADE_RVOL_THRESHOLD }}
          DAY_TRADE_MIN_SETUP_SCORE: ${{ vars.DAY_TRADE_MIN_SETUP_SCORE }}
          MORNING_REPORT_TIME: ${{ vars.MORNING_REPORT_TIME }}
          MORNING_REPORT_TIMEZONE: "Asia/Kuala_Lumpur"
          LIVE_ALERT_ENABLED: ${{ vars.LIVE_ALERT_ENABLED }}
          LIVE_ALERT_INTERVAL_MINUTES: ${{ vars.LIVE_ALERT_INTERVAL_MINUTES }}
          LIVE_MARKET_TIMEZONE: "America/New_York"
          LIVE_MARKET_OPEN: "09:30"
          LIVE_MARKET_CLOSE: ${{ vars.LIVE_MARKET_CLOSE }}
          ALERT_MIN_SETUP_SCORE: ${{ vars.ALERT_MIN_SETUP_SCORE }}
          ALERT_MIN_RVOL: ${{ vars.ALERT_MIN_RVOL }}
          ALERT_COOLDOWN_MINUTES: ${{ vars.ALERT_COOLDOWN_MINUTES }}
          ENABLE_NEWS: ${{ vars.ENABLE_NEWS }}
          NEWS_PROVIDER: "yfinance,google_rss,bing_rss"
          NEWS_LOOKBACK_HOURS: ${{ vars.NEWS_LOOKBACK_HOURS }}
          NEWS_DIAGNOSTICS: "1"
          DATABASE_ENABLED: ${{ vars.DATABASE_ENABLED }}
          ENABLE_OUTCOME_TRACKING: ${{ vars.ENABLE_OUTCOME_TRACKING }}
          ENABLE_BACKTEST: ${{ vars.ENABLE_BACKTEST }}
          SIGNAL_DB_PATH: ${{ vars.SIGNAL_DB_PATH }}
          SIGNAL_EXPIRY_HOURS: ${{ vars.SIGNAL_EXPIRY_HOURS }}
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          REPORT_WINDOW: ${{ steps.report_window.outputs.report_window }}
        run: python -m src.daily_stock_analyse

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: daily-stock-analysis-report
          path: artifacts/
          if-no-files-found: warn
