name: Daily Stock Analysis

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * 1-5"

env:
  SEND_EMAIL: "1"

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Debug secret availability
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          if [ -n "$RESEND_API_KEY" ]; then
            echo "RESEND_API_KEY is present"
          else
            echo "RESEND_API_KEY is MISSING"
          fi

          if [ -n "$EMAIL_FROM" ]; then
            echo "EMAIL_FROM is present"
          else
            echo "EMAIL_FROM is MISSING"
          fi

          if [ -n "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is present"
          else
            echo "OPENAI_API_KEY is MISSING"
          fi

          if [ -n "$EMAIL_TO" ]; then
            echo "EMAIL_TO is present"
          else
            echo "EMAIL_TO is MISSING"
          fi

      - name: Run analysis
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          DAILY_REPORT_CRON_UTC: ${{ vars.DAILY_REPORT_CRON_UTC }}
          MIN_SETUP_SCORE: ${{ vars.MIN_SETUP_SCORE }}
          MIN_RELATIVE_VOLUME: ${{ vars.MIN_RELATIVE_VOLUME }}
          DAY_TRADE_THRESHOLD: ${{ vars.DAY_TRADE_THRESHOLD }}
          LONG_THRESHOLD: ${{ vars.LONG_THRESHOLD }}
          SHORT_THRESHOLD: ${{ vars.SHORT_THRESHOLD }}
          DYNAMIC_COUNT: ${{ vars.DYNAMIC_COUNT }}
        run: python -m src.daily_stock_analyse

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-stock-analysis-report
          path: artifacts/
